<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Mini Chat</title>
    <link rel="stylesheet" href="./css/style.css">
    <script>
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark-theme");
      }
    </script>
  </head>

  <body>

    <div class="chat">
      <div class="chat-header">
        <span>Mini Chat</span>
        
        <div class="menu-container">
          <button id="burger-btn" class="burger-btn">☰</button>
          
          <div id="dropdown-menu" class="dropdown-menu hidden">
            <div class="menu-item theme-item">
              <span>Night Mode</span>
              <label class="switch">
                <input type="checkbox" id="theme-switch">
                <span class="slider"></span>
              </label>
            </div>
            <button id="clear-btn" class="menu-item clear-btn">Clear Chat</button>
          </div>
        </div>
      </div>

      <div id="confirm-modal" class="modal hidden">
        <div class="modal-card">
          <p>Are you sure you want to clear your message history?</p>
          <div class="modal-actions">
            <button id="btn-yes" class="btn-yes">Yes</button>
            <button id="btn-no" class="btn-no">No</button>
          </div>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <form id="chat-form" class="chat-form">
        <input type="text" id="message-input" placeholder="Write a message..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>

    <script src="./js/app.js"></script>
  </body>

</html>
